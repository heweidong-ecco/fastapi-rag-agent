name: CI

# 两个 job，职责分开：
#   syntax        —— **语法级**（compileall），秒级，故意保持"重构无关"：只查语法，不管你怎么改目录和模块。
#   offline-tests —— **M6 接进来的离线测试闭环**（2026-09-17）。见 ROADMAP.md「⑦ M6」与 docs/decisions/DEC-013。
#
# ⚠️ offline-tests 为什么是现在这个样子：
#   · 跑 **`api/` 全套**，用两个 marker 挡掉跑不了的：
#       `-m "not integration and not needs_db"` —— 实测 **48 passed / 1 skipped**。
#   · 🔴 **必须给 redis service** —— 不是可选项。`RateLimitMiddleware` 对每个非公开路径都打 Redis，
#     且 `rate_limiter.py` 没有 `except RedisError` 兜底 ⇒ **Redis 不通时全站 500**（实测）。
#   · **不需要 postgres** —— 带库的那几处已按 marker 标记（实测：把 `POSTGRES_PORT` 指向死端口，被挡掉后全绿）。
#   · 环境变量给的是 **dummy 值**：`import main` 在导入期就会构造 OpenAI 客户端，
#     空 key 会直接抛 OpenAIError（实测）。这些路径在离线用例里**永远不会被真正调用**。
#   · `GRADIO_ANALYTICS_ENABLED=False` 是**双保险**：`api/conftest.py` 里已设，
#     但那边一旦被绕过，Gradio 的遥测非 daemon 线程会**卡住进程退出**（详见 conftest 注释）。
#   · `timeout-minutes` 是**兜底**：2026-09-17 实测过一个"测试全过但进程不退出"的缺陷
#     —— 没有超时上限时，那种卡住会一直耗；有上限，"卡住"才是一个**显式状态**。
#
# ⚠️ 仍然不进 CI 的（**已登记，不是忘了**）：
#   · `integration` —— 要真 postgres + DashScope 外网，进去就是 flaky
#   · `needs_db` —— 要真 postgres（CI 里没有这个 service；加它要建表/迁移，不是几十行的事）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: 语法检查（compileall）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 与 api/Dockerfile 的基础镜像（python:3.10-slim）保持一致，
          # 否则本机能跑通、容器里报 SyntaxError 的写法拦不住。
          python-version: "3.10"

      - name: 编译检查 api/ 下全部 Python 文件
        run: python -m compileall api/ -q

      # ⚠️ **只跑 `--self-test`，⛔ 不跑真正的三方比对** —— 本步【不连网、不需凭据】。
      # 为什么真正的比对不能在这里跑：CI 里"本地"就是刚 checkout 的那份 ⇒ 三方恒等 ⇒ 跑了等于没跑
      # （`DEC-069` §四）。而 self-test 只验**裁决逻辑**（8 个分支各走一遍），与网络无关。
      # 📌 加它的理由：那条裁决里最要紧的一支是「取不到真值 ⇒ 未知，⛔ 不是通过」，
      #    而"守卫必须能测出自己会红"是本仓已记两次的教训（`DEC-061` / `DEC-066`）。
      - name: 「本地 / 视图 / 远端真值」裁决逻辑自测（⛔ 不连网）
        run: bash scripts/check_remote_sync.sh --self-test

  offline-tests:
    name: 离线测试（api/ 全套 · 减 integration/needs_db · redis）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: 安装测试依赖
        # 🔴 2026-09-20 改：此前装的是 `api/requirements-test.txt`（一份"只做减法"的平行清单）。
        # 业务方裁决：「**不用双 requirements.txt，这样会混**」⇒ 删掉那份，CI 装**同一份**。
        # 安全性已核：实测 `-test` 是 `requirements.txt` 的**真子集**
        #   （含版本约束在内比对整行 ⇒ 只在 `-test` 里的行 = 空），切过去**不丢任何包**。
        # 🔴 2026-10-01 改：**装的时候按 `DEC-034 §🅱️` 那套裁法过滤**
        #   （业务方指令：「不要给 GitHub 的 CI 的 requirements 拉 torch」）。
        #   `api/requirements.txt:59` 的 sentence-transformers 在 pip 眼里会连带拉
        #   **torch 554.6 MB** —— 而它只是 `reranker.get_reranker()` 的懒加载依赖，
        #   **离线用例一条都不碰它**（判据见下，是实测的不是读代码的）。
        #   ⚠️ 与 `api/Dockerfile:73` 是**同一套正则**（同一件事的两个落点）⇒ ⛔ 改一处要两处一起改。
        #   ⛔ **不动 `requirements.txt` 本身** —— 仓里仍只有一份清单（DEC-019 不破）。
        #
        #   📊 **改前的实测（2026-09-20）**：稳态 **2m50s**（缓存热）/ 3m35s（缓存冷）；
        #      更早用 `requirements-test.txt` 时是 **1m12s – 1m27s** ⇒ 多出来那一分多钟基本就是这批重包。
        #      ⚠️ 改后的实测数见本条 commit —— **别拿上面这两个旧数当现状**。
        #
        #   ✅ **判据（2026-10-01 实测，不是读代码）**：同一棵树 / 同一套 env / **无 .env** / 临时 redis，
        #      用导入拦截器把这 5 个包变成 ImportError，前后各跑一遍：
        #        对照组 `139 passed, 3 skipped, 11 deselected`
        #        实验组 `139 passed, 3 skipped, 11 deselected`   ← **逐字相同，零 ImportError**
        run: |
          FILTER='^(sentence-transformers|transformers|locust|ragas|datasets)'
          grep -vE "$FILTER" api/requirements.txt > /tmp/req-light.txt
          echo "--- 被裁掉的（应 5 行）---"
          grep -cE "$FILTER" api/requirements.txt || echo "(0 —— ⚠️ 与预期 5 不符：先看 requirements.txt 是不是改名了)"
          echo "--- 剩余行数 ---"
          wc -l < /tmp/req-light.txt
          pip install -r /tmp/req-light.txt

      - name: 跑离线测试
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          # ⚠️ 以下全部是 **dummy 值**，不是凭据。任务书：
          #   `import main` 在导入期构造 OpenAI 客户端，空 key 会抛 OpenAIError；
          #   离线用例不会真正调用这些服务，故给个非空占位即可。
          DASHSCOPE_API_KEY: ci-dummy-not-a-real-key
          LLM_API_KEY: ci-dummy-not-a-real-key
          POSTGRES_PASSWORD: ci-dummy-not-a-real-key
          JWT_SECRET_KEY: ci-dummy-not-a-real-key
          LOGIN_PASSWORD: ci-dummy-not-a-real-key
        run: |
          # ⭐ 先打印【本次实际生效的配置】。
          #   2026-10-01 那次 CI 红（`assert 0.003 >= 0.008`），我是靠反推
          #   `api/config.py:55` 才知道「CI 没有 .env ⇒ 落到代码默认值 qwen-plus」。
          #   ⇒ 把它打到日志里，下次一眼看得出"这次是在哪套配置下红的"。
          # ⚠️ 本块与下面的 pytest **共用同一个 env:** —— 打印的就是 pytest 用的那套。
          python - <<'PY'
          import os, socket, sys
          sys.path.insert(0, "api")
          import config
          print(f"[ci-config] LLM_MODEL_FAST = {config.LLM_MODEL_FAST}")
          print(f"[ci-config] LLM_MODEL_CHAT = {config.LLM_MODEL_CHAT}")
          print(f"[ci-config] .env 存在吗    = {os.path.exists('.env')}")
          try:
              socket.create_connection(("127.0.0.1", 6379), 2).close()
              print("[ci-config] redis 6379     = 通")
          except OSError as e:
              print(f"[ci-config] redis 6379     = 不通 ({e})")
          PY
          # ⭐ 路由鉴权门（2026-10-05 加，`DEC-074`）—— ⚠️ **必须排在 pytest 前面**。
          #   理由：本块是 `bash -e` 语义，**先红的那条会吃掉后面**。
          #   pytest 动辄几分钟且本仓红过多次；这条只要 ~10s ⇒ 放前面，
          #   保证「新引入了没鉴权的路由」**一定会被跑**，而不是"pytest 挂了所以没轮到它"。
          #
          #  🔴 为什么它此前【形同虚设】：脚本 2026-09-30 就建好了，也挂了 hook，
          #     但**这里是空的**（`grep -n check_route_auth .github/workflows/ci.yml` ⇒ 无）。
          #     ⇒ 它只在"Claude 会话里改路由文件"时提醒一句 —— 正是本仓
          #       「**门挂在别处，就等于没有门**」那句原话的又一例。
          #  ⚠️ 判据不是"跑过了"，是 **exit 0 且打印「✅ 与基线一致」**（见脚本末尾）。
          #
          #  ⛔ 别写成 `venv/bin/python … || python …` —— 那样**检查失败（exit 1）会掉进
          #     第二个解释器再跑一遍**，把红灯洗成绿灯（或反过来撞出假的 ImportError）。
          #     ⇒ 先**只选解释器**，再跑一次检查。
          #  ⛔ 也别写成 `[ -x … ] && PY_ROUTE=…` —— 本块跑在 `bash -e` 下，
          #     条件为假时**整条 AND-list 返回非零 ⇒ 脚本当场退出**（经典 set -e 坑）。
          PY_ROUTE=python
          if [ -x venv/bin/python ]; then PY_ROUTE=venv/bin/python; fi
          "$PY_ROUTE" scripts/check_route_auth.py --baseline
          pytest api/ -m "not integration and not needs_db" -v

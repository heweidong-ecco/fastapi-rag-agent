<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工接管</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  /* 本页只写【页面专属】规则 —— 通用组件与 token 在 `/static/app.css`。
   * 2026-10-08：删掉本页自带的 `:root`（与全局 token 同名不同值），硬编码色换成 token。
   * 🔴 2026-10-10（施工单**刀 8**）两件事：
   *   ① 与全站重复的（`table`/`th`/`td` · `#notice` · `pre` · `details summary` ·
   *      以及那句 `body { padding }` —— 它与骨架**打架**）⇒ 已收进 `app.css` §4.9；
   *   ② 🔴 **本页补上了 `.app-shell` 骨架** —— 原先它是个**裸文档**（没有侧边栏、没有页头），
   *      而它是「人工接管」，属**5 类主要功能之一**，别的四个主要功能页都有骨架。
   * ⚠️ ⛔ 没有改 class 名 / id / JS 的取值 —— 页面脚本按它们建元素。 */

  :root {
    /* 三种消息各一种颜色 —— 它们是**谁说的**，⛔ 不是好看用的 */
    --human: var(--info); --ai: var(--ok); --tool: var(--warn);
  }

  tr.pick > td { background: color-mix(in srgb, var(--info) 8%, transparent); }

  .msg { border-left: 3px solid var(--line); padding: 2px var(--sp-2); margin: var(--sp-1) 0; }
  .msg.human { border-color: var(--human); } .msg.ai { border-color: var(--ai); }
  .msg.tool  { border-color: var(--tool); }
  .msg .role { font-weight: 600; font-size: var(--fs-cap); color: var(--fg-dim); }

  #opbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
           padding: var(--sp-3); margin: var(--sp-2) 0; }
  #edited { width: 100%; min-height: 64px; }
</style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">青云精工 · RAG</div>
    <nav class="nav">
      <a href="/chat">对话</a>
      <a href="/lab">检索实验室</a>
      <a href="/approvals" class="active">人工接管</a>
      <a href="/cost">成本看板</a>
      <a href="/trace">执行轨迹</a>
      <a href="/eval">评测</a>
    </nav>
  </aside>

  <div class="main">

    <header class="page-head">
      <h1>人工接管</h1>
      <span class="spacer"></span>
      <!-- 🔴 凭据（`DEC-143`）：demo 那条路上**首访就自动领到** ⇒ 这里只显示「有」，
           ⛔ 一个字节的明文都不进页面（只显示"有没有"和"还剩多少"）。
           **领不到**（本仓那条路，那条端点压根不存在）⇒ 落回下面那一对
           「填 + 保存」= 今天的样子。两块的显隐由 `RagCred.applyMode()` **一处**切。 -->
      <span class="field" id="cred-auto" hidden>凭据 <b>已自动获得</b><span id="cred-quota"></span></span>
      <button type="button" id="swapkey" class="btn" hidden>换一把</button>
      <label class="field" id="cred-manual">API Key <input id="apikey" type="password" placeholder="X-API-Key"></label>
      <button id="save" class="btn">保存</button>
      <button id="refresh" class="btn">刷新</button>
    </header>

    <div class="content">
      <div id="notice" class="notice"></div>

      <!-- 🔴 原先这句里写的是 `**完整上下文**` —— **两个星号是直接印在页面上的**
           （页面一律 `textContent`，markdown 记号会原样出来）。2026-10-10 修成 `<b>`。
           ⚠️ ⛔ **不是改文案口径** —— 口径那两句（熔断「这不是故障」· 拒答「资料里没有」）一个字没动；
              这里修的是**渲染**。同族缺陷本仓已记三次（tools / system / ops 各有守卫钉着）。 -->
      <p class="sub">待接管会话 · 点一行看<b>完整上下文</b> · 批准 / 拒绝 / 代替模型给出这次工具调用的结果</p>

      <!-- 🔴 边界标注（规格 §3.6.1 的② · 提示在前）。文案【只从 RagPanel 取】。 -->
      <section class="panel" id="boundary" aria-label="使用前必读（平台与额度边界）"
               style="margin-bottom:var(--sp-4)">
        <div class="panel-body">
          <h2 style="margin-top:0">使用前必读</h2>
          <div class="panel-boundary" data-boundary="platform_restart"></div>
          <div class="panel-boundary" data-boundary="quota"></div>
          <div class="panel-boundary" data-boundary="rate_limit"></div>
          <div class="panel-boundary" data-boundary="real_api"></div>
        </div>
      </section>

<h2>待接管</h2>
<table id="pending" class="tbl">
  <thead><tr><th>属主</th><th>图</th><th>轮次</th><th>卡了多久</th><th>待批的工具</th></tr></thead>
  <tbody></tbody>
</table>

<div id="opbox" hidden>
  <h2>上下文 <span class="sub" id="ctxwho"></span></h2>
  <div id="ctx"></div>
  <h2>代替模型执行这次工具调用</h2>
  <p class="sub">它拿着你给的结论继续往下答。<b>不填也能批 / 拒</b> —— 不填就是「原样放行」。</p>
  <textarea id="edited" placeholder="（可留空）"></textarea>
  <!-- 🔴 提示条排在按钮【之前】（规格 §3.6.1 的② · `DEC-123` §1.1） -->
  <div class="panel-boundary slim" data-boundary="real_api"></div>
  <p>
    <button id="approve" class="btn primary">批准</button>
    <button id="reject" class="btn danger">拒绝</button>
  </p>
</div>

<h2>裁决历史</h2>
<table id="history" class="tbl">
  <thead><tr><th>属主</th><th>谁批的</th><th>裁决</th><th>改写</th><th>轮次</th><th>为什么</th></tr></thead>
  <tbody></tbody>
</table>

<!-- 🔴 分页控件（2026-10-08 加 · `frontend/README.md` §六）——
     它补的是本页原来那个**静默截断**：原先硬写 `limit=50`，**界面不说明被截了**。
     ⚠️ 这是**新增**元素，⛔ 没有改任何既有 class / id。 -->
<div id="pager" class="pagination" hidden>
  <button id="prevpage" class="btn">上一页</button>
  <span id="pagelabel" class="page-label"></span>
  <button id="nextpage" class="btn">下一页</button>
  <span id="pagehint" class="page-hint"></span>
</div>

    </div>
  </div>
</div>

<!-- 🔴 凭据（`DEC-143`）：`session.js`（凭据本身）**必须**排在 `cred.js` 与页面脚本之前。 -->
<script src="/static/js/session.js"></script>
<script src="/static/js/cred.js"></script>
<script src="/static/js/panel.js"></script>
<script src="/static/js/approvals.js"></script>
<script>
'use strict';

/* 🔴 **本页每一个 URL 都必须带 `/api/v1` 前缀。**
   少一个前缀 = 浏览器打到 404，而**服务端不会报任何错** —— 本页就这么坏过：
   4 条 fetch 全写成了 `/agent/…`，页面从合进去那天起 100% 不可用，且没有任何用例红
   （见 `DEC-093` §四）。⇒ 不靠自觉：`app/tests/test_web_pages.py` 会把它们拦下。 */
const $ = (id) => document.getElementById(id);
let picked = null;                     // 当前选中的那一行
let timer = null;

/* 🔴 凭据**只有一份实现** ⇒ `RagSession`（`/static/js/session.js` · `DEC-143`）。
   ⛔ 别在这页里再写一份「凭据存在哪个键、怎么取」—— 8 个页面各写一遍正是这一版要收掉的债
      （改前 8 个页面各有一份；改后全站只剩 `session.js` 那一份）。
   ⚠️ `key()` 仍是**同步**的、**同签名** ⇒ 页面里其余那些调用一个字没动。 */
const key = () => RagSession.key();

function notice(msg, bad) {
  const el = $('notice');
  el.textContent = msg || '';
  el.classList.toggle('bad', !!bad);
}

/* 🔴 401/403 与 503/429 要分开说 —— 与 chat.html 的 explainStatus 同款口径（DEC-082/N9）。 */
function explainStatus(status) {
  if (status === 401 || status === 403) return 'Key 不对或没权限（401/403）';
  if (status === 429) return '被限额拦下了（429）—— 稍后再试';
  if (status >= 500) return '服务端出问题了（' + status + '）';
  return '请求失败（' + status + '）';
}

async function getJSON(url) {
  const r = await fetch(url, { headers: { 'X-API-Key': key() } });
  if (!r.ok) throw new Error(explainStatus(r.status));
  return r.json();
}

/* ==================== 上 · 待接管列表 ==================== */

async function loadPending() {
  const data = await getJSON('/api/v1/agent/pending');
  const body = $('pending').querySelector('tbody');
  body.innerHTML = '';
  const now = Date.now() / 1000;
  for (const row of data.items) {
    const tr = document.createElement('tr');
    if (picked && picked.thread_id === row.thread_id && picked.owner === row.user_name) {
      tr.className = 'pick';
    }
    const cells = [
      row.user_name,
      row.graph || 'agent_graph',
      String(row.rounds || 1),
      RagApprovals.formatElapsed(now - row.since),
      RagApprovals.summarizeToolCalls(row.tool_calls),
    ];
    for (const text of cells) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    }
    tr.onclick = () => openContext(row);
    body.appendChild(tr);
  }
  if (data.items.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5; td.textContent = '（当前没有等待接管的会话）';
    tr.appendChild(td); body.appendChild(tr);
  }
}

/* ==================== 点开 · 完整上下文 ==================== */

async function openContext(row) {
  const q = RagApprovals.buildContextQuery(row.raw_thread_id, row.user_name);
  const data = await getJSON('/api/v1/agent/pending/context?' + q);
  if (data.status !== 'ok') { notice(data.message, true); return; }
  picked = { thread_id: row.raw_thread_id, owner: row.user_name };
  $('opbox').hidden = false;
  $('ctxwho').textContent = '属主 ' + data.owner + ' · ' + data.graph +
                            ' · 第 ' + data.rounds + ' 轮 · 停于 ' + data.next.join(',');
  const box = $('ctx');
  box.innerHTML = '';
  data.messages.forEach((msg) => {
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.type || '');
    const role = document.createElement('div');
    role.className = 'role';
    role.textContent = msg.type + (msg.name ? ' · ' + msg.name : '');
    div.appendChild(role);
    const pre = document.createElement('pre');
    pre.textContent = RagApprovals.messageText(msg) || '（无文本）';
    div.appendChild(pre);
    if (msg.tool_calls && msg.tool_calls.length) {
      const d = document.createElement('details');
      d.innerHTML = '<summary>待批的工具调用</summary>';
      const p = document.createElement('pre');
      p.textContent = JSON.stringify(msg.tool_calls, null, 2);
      d.appendChild(p); div.appendChild(d);
    }
    box.appendChild(div);
  });
  notice('');
}

/* ==================== 操作区 ==================== */

async function decide(decision) {
  if (!picked) { notice('先点一行选一个会话', true); return; }
  const q = RagApprovals.buildApprovePayload(
    picked.thread_id, picked.owner, decision, $('edited').value);
  const r = await fetch('/api/v1/agent/approve?' + q, {
    method: 'POST',
    headers: { 'X-API-Key': key() },
  });
  if (!r.ok) { notice(explainStatus(r.status), true); return; }
  const data = await r.json();
  if (data.status === 'error') { notice(data.message, true); return; }
  notice('已' + (data.status === 'pending_approval' ? '放行（模型又停在审批点了 —— 见下一条）'
                                                    : decision === 'approve' ? '批准' : '拒绝'));
  $('edited').value = '';
  picked = null;
  $('opbox').hidden = true;
  await refreshAll();
}

/* ==================== 下 · 裁决历史 ==================== */

/* 🔴 分页（`frontend/README.md` §六）—— 当前页码状态，由 `pagerState` 算，⛔ 本页不自己推。
   ⚠️ 原来这里硬写 `limit=50` —— 那是**静默截断**：界面不说明被截了。 */
let histOffset = 0;
const HIST_PAGE = 50;

async function loadHistory(offset) {
  if (offset === undefined) offset = histOffset;
  const data = await getJSON(
    '/api/v1/agent/approvals/history?limit=' + HIST_PAGE + '&offset=' + offset);
  const body = $('history').querySelector('tbody');
  body.innerHTML = '';
  for (const ev of data.events) {
    const tr = document.createElement('tr');
    for (const text of [ev.owner, ev.actor, ev.decision, ev.edited ? '有' : '—',
                        String(ev.rounds ?? '—'), ev.reason || '—']) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  histOffset = offset;
  renderPager(data, offset);
}

/* 🔴 分页控件的渲染（`frontend/README.md` §六）。
   ⚠️ **页码与"还有没有下一页"一律由 `RagApprovals.pagerState` 算** —— ⛔ 本页不自己推。
      ⛔ 尤其**不拿 `count == limit` 猜 `has_more`**：那在"正好一整页、后面没有了"时
      会显示一个**点不动的下一页**，而且不报错。`has_more` 只认服务端给的那个字段。
   ⚠️ **只有一页时整个控件不显示** —— 一个永远点不动的翻页条比没有更糟。 */
function renderPager(data, offset) {
  const st = RagApprovals.pagerState({
    offset: offset, limit: data.limit, hasMore: data.has_more,
  });
  const box = $('pager');
  box.hidden = !st.hasPrev && !st.hasNext;
  $('pagelabel').textContent = st.label + ' · 本页 ' + data.count + ' 条';
  $('prevpage').disabled = !st.hasPrev;
  $('nextpage').disabled = !st.hasNext;
  // 🔴 两个偏移量存在 dataset 上，⛔ 不在闭包里另算一份（两处算 = 迟早不一致）
  box.dataset.prev = String(st.prevOffset);
  box.dataset.next = String(st.nextOffset);
  $('pagehint').textContent = st.hasNext ? '后面还有' : '已经到底了';
}

$('prevpage').addEventListener('click', () => {
  loadHistory(Number($('pager').dataset.prev)).catch((e) => notice(e.message, true));
});
$('nextpage').addEventListener('click', () => {
  loadHistory(Number($('pager').dataset.next)).catch((e) => notice(e.message, true));
});

/* ==================== 刷新：轮询 5s，仅页面可见（裁定 5） ==================== */

async function refreshAll() {
  try {
    await loadPending();
    await loadHistory();
  } catch (e) { notice(e.message, true); }
}

function schedule() {
  if (timer) { clearTimeout(timer); timer = null; }
  const delay = RagApprovals.nextPollDelay(document.visibilityState);
  if (delay === null) return;                       // 不可见 ⇒ 不排下一次
  timer = setTimeout(async () => { await refreshAll(); schedule(); }, delay);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshAll();   // 回到前台立刻刷一次
  schedule();
});

/* 边界标注（2026-10-10 · 施工单刀 8）：文案【只从 `RagPanel` 取】——
   ⛔ 别在这份 HTML 里再抄一遍（规格 §3.6.2 · 「边界文案全站只有一份」）。 */
document.querySelectorAll('[data-boundary]').forEach((n) => {
  n.textContent = n.classList.contains('slim')
    ? RagPanel.boundaryShort(n.dataset.boundary)
    : RagPanel.boundaryText(n.dataset.boundary);
});

$('save').onclick = () => {
  RagSession.save($('apikey').value.trim());
  notice('已保存'); refreshAll(); schedule();
};
$('refresh').onclick = () => { refreshAll(); schedule(); };
$('approve').onclick = () => decide('approve');
$('reject').onclick  = () => decide('reject');

/* 🔴 起页面前**先把凭据弄妥**（`DEC-143`）：demo 那条路上首访时手里还没有凭据，
   照旧发请求的话第一批全是 401 —— 而访客什么都没做错。
   本仓那条路 `ensureKey()` 立刻回空串 ⇒ 下面这一行与今天**逐字一致**。 */
RagCred.mount((auto) => {
  // ⚠️ **只有"自己填"那条路才回填输入框** —— 自动形态下那个框已经收起来了，
  //    再写进去只会让明文多落在 DOM 里一个地方（`DEC-143 §四`：页面上⛔ 不出现凭据明文）。
  if (!auto) $('apikey').value = key();
  if (key()) { refreshAll(); schedule(); } else { notice('先填 API Key', true); }
});
</script>
</body>
</html>

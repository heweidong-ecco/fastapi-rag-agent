<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 对话</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  /* ══════════════════════════════════════════════════════════════════════════
   * 本页只写【页面专属】规则；token 与通用组件在 `/static/app.css`
   *   （= `frontend/README.md` §三–§五 那份规范的实现）。
   *
   * 🔴 **2026-10-09 重排**：按风格稿（+ `ui-ux-pro-max` 的 `Data-Dense Dashboard` 风格）
   *   从"左边一条会话列表 + 右边上下堆消息"改成 **sidebar + page-head + 内容区**，
   *   消息**卡片化并淡入**。
   * ⚠️ **⛔ 没有改任何 class 名 / id / JS** —— 页面脚本按这些名字建元素
   *   （判据：`id` 逐个核过，一个没丢）。
   * ⛔ 文案口径也没动：熔断卡的「这不是故障」、拒答的「资料里没有」都是裁过的
   *   （`DEC-090` / `DEC-091`）—— **改样式 ⛔ 不等于可以改字**。
   * ══════════════════════════════════════════════════════════════════════════ */

  /* ── 登录（未登录时唯一看得见的东西 —— 给它一块 hero） ── */
  #login { max-width: 640px; margin: 9vh auto var(--sp-6); padding: 0 var(--sp-4); }
  .login-sub { margin: var(--sp-2) 0 0; opacity: .92; }
  .login-card { margin-top: var(--sp-4); }
  .login-card > .hint { margin: 0 0 var(--sp-3); }

  /* ── 侧栏里的会话列表（`.sidebar` 本身在 app.css） ── */
  .side-sep { padding: var(--sp-4) var(--sp-4) 0; }
  .side-sep h2 { font-size: var(--fs-cap); color: var(--fg-dim); margin: 0 0 var(--sp-2);
                 letter-spacing: .02em; }
  .threads { flex: 1; overflow-y: auto; min-height: 0; padding: 0 var(--sp-2); }
  .thread { padding: var(--sp-2) var(--sp-3); border-radius: var(--r-ctl); cursor: pointer;
            font-size: var(--fs-body); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; transition: background .12s; }
  .thread:hover { background: color-mix(in srgb, var(--info) 8%, transparent); }
  .thread.active { background: color-mix(in srgb, var(--info) 13%, transparent);
                   color: var(--info); font-weight: 600; }
  .side-foot { padding: var(--sp-3); }
  .side-foot .btn { width: 100%; }

  /* ── 消息流 ── */
  /* ⚠️ **`margin: 0`，⛔ 不是 `0 auto`** —— 居中的话，消息的左边缘与上面的
     `page-head`【不在一条线上】，看起来像两块东西拼的（2026-10-09 截图时看出来的）。 */
  /* 🔴 `flex: 1; min-height: 0` 是 **2026-10-09 截图时才补的**（刀 2 检查点）：
     原先只有 max-width/margin/padding ⇒ `.main` 那个 flex 列里**没人吃掉剩余高度**
     ⇒ **空会话时消息区被挤成 0 高、输入框贴在页头下面**（截图里一眼就看出来，而
     `node --test` 与 pytest **一条都不会红**）—— 本仓原话：「用例全绿证不了页面没坏」。
     `min-height: 0` 不能省：flex 子项默认 `min-height: auto`，不加它 `overflow: auto` 不生效。 */
  .log { flex: 1; min-height: 0; max-width: 900px; margin: 0;
         padding: var(--sp-5) var(--sp-5) var(--sp-4); }

  /* ⚠️ 动效只做【一个有意义的】：新消息**淡入上浮** —— 它表达"这条是刚来的"，
     而不是为了好看而好看（`ui-ux-pro-max` 的 7 号规则：Motion conveys meaning）。
     🔴 **必须带 `prefers-reduced-motion`** —— 那条例子里把它列为反模式。 */
  .turn { margin-bottom: var(--sp-5); animation: msgRise .22s ease-out both; }
  @keyframes msgRise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }

  .q { font-weight: 600; display: flex; gap: var(--sp-2); align-items: baseline; }
  .q::before {
    content: "问"; flex: none; font-size: var(--fs-cap); font-weight: 400;
    color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent);
    border-radius: var(--r-pill); padding: 1px var(--sp-2);
  }
  .a { white-space: pre-wrap; max-width: 62ch; margin-top: var(--sp-2); }
  .meta { color: var(--fg-dim); font-size: var(--fs-cap); margin-top: var(--sp-2);
          display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
  .badge { }                                   /* 外观走 app.css 的 .badge */
  /* 🔴 刀 2（§7.1①）：原文里**与答案逐字重合**的片段。
     ⚠️ 语义色用 `--warn` 的那一档（"这是一个标记"），⛔ 别用渐变/彩色 —— 它旁边还有正文。
     ⛔ 别把它做成整段变色：高亮的是"抄自原文的那几个字"，**空的时候一个字都不标**。 */
  .src-body mark { background: color-mix(in srgb, var(--warn) 28%, transparent); color: inherit; }
  .cite { color: var(--info); cursor: pointer; text-decoration: underline;
          text-underline-offset: 2px; }
  .cite.open { font-weight: 600; }

  /* 🔴 `DEC-089`：「甲 · 就地展开/收起」⇒ 卡片挂在该条回答【下面】，⛔ 不再是全局一个 #card。
     每条回答自带一个（`addTurn` 里建，默认 `hidden`）。⛔ 类名不改（JS 按它建）。 */
  .card { border: 1px solid var(--line); border-left: 3px solid var(--info);
          border-radius: var(--r-card); padding: var(--sp-3); margin-top: var(--sp-2);
          background: color-mix(in srgb, var(--info) 6%, transparent); font-size: var(--fs-body); }
  .card .src { font-weight: 600; }
  .card .src-meta { color: var(--fg-dim); font-size: var(--fs-cap); margin: var(--sp-1) 0 var(--sp-2); }

  /* 🔴 `DEC-090` · `R3.2`：熔断卡片。**与 `.card` 分开一个元素** ——
     引用卡片由 `_openIndex` 驱动、每次重画都被清空，两者抢一个容器会互相抹掉。 */
  .breaker { border: 1px solid var(--line); border-left: 3px solid var(--warn);
             border-radius: var(--r-card); padding: var(--sp-3); margin-top: var(--sp-2);
             background: color-mix(in srgb, var(--warn) 10%, transparent); font-size: var(--fs-body); }
  .breaker .bk-title { font-weight: 600; font-size: var(--fs-h3); margin-bottom: var(--sp-2); }
  .breaker .bk-row { display: flex; gap: var(--sp-2); margin: var(--sp-1) 0; }
  .breaker .bk-k { flex: 0 0 5.5em; color: var(--fg-dim); }

  /* 🔴 `DEC-091` · `F4` ①：无据拒答的提示条。**与 `.breaker` 分开一个类** ——
     那是"额度用完了"（该做的是等跨天 / 开新会话），这是"资料里没有"（该做的是换问法 / 补文档）：
     两者出路相反，合成一张卡会把用户引到**做不到的处置**上。
     ⚠️ 中性灰，⛔ 不用熔断那个警示黄 —— 拒答**不是故障**，不该看着像出事。 */
  .noinfo { border: 1px solid var(--line); border-left: 3px solid var(--fg-dim);
            border-radius: var(--r-card); padding: var(--sp-3); margin-top: var(--sp-2);
            background: color-mix(in srgb, var(--fg-dim) 7%, transparent); font-size: var(--fs-body); }
  .noinfo .ni-title { font-weight: 600; font-size: var(--fs-h3); margin-bottom: var(--sp-1); }
  .noinfo .ni-body { color: var(--fg-dim); }

  /* ── 输入区（固定在主区底部；`.main` 是 flex 列 ⇒ 自然贴底） ── */
  #composer { border-top: 1px solid var(--line); background: var(--surface);
              padding: var(--sp-3) var(--sp-5); display: flex; gap: var(--sp-2); }
  #q { flex: 1; }

  .hint { color: var(--fg-dim); font-size: var(--fs-body); }
</style>
</head>
<body>

<!-- ============ 登录态（没有 key 时唯一看得见的东西） ============ -->
<div id="login" hidden>
  <div class="hero login-hero">
    <h1>青云精工 · RAG 对话</h1>
    <p class="login-sub">检索 · 溯源 · 成本可见 —— 一个能指着引用说话的问答服务。</p>
  </div>
  <div class="card login-card">
    <p class="hint">粘一把 API Key（<code>sk-…</code>）。它只存在<strong>这台机器的 localStorage</strong> 里。</p>
    <input id="apikey" type="password" placeholder="sk-…" autocomplete="off">
    <p style="margin:var(--sp-4) 0 0"><button id="save" class="btn primary">开始</button></p>
    <p class="hint" style="margin-top:var(--sp-4)">没有 key ⇒ 在本机跑
      <code>python3 scripts/issue_api_key.py &lt;你的名字&gt;</code></p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app-shell" hidden>

  <aside id="side" class="sidebar">
    <div class="brand">青云精工 · RAG</div>
    <nav class="nav">
      <a href="/chat" class="active">对话</a>
      <a href="/lab">检索实验室</a>
      <a href="/approvals">人工接管</a>
      <a href="/cost">成本看板</a>
      <a href="/trace">执行轨迹</a>
      <a href="/eval">评测</a>
    </nav>

    <div class="side-sep"><h2>会话</h2></div>
    <div id="threads" class="threads"></div>
    <div class="side-foot"><button id="newthread" class="btn">＋ 新会话</button></div>
  </aside>

  <div id="main" class="main">
    <header class="page-head">
      <h1>对话</h1>
      <!-- 🔴 链选择器（刀 2 · 2026-10-09）：6 条链**各有各的实现**，让访客当场换一条再问同一个问题。
           ⚠️ 选项由 `RagSse.CHAINS` 生成（⛔ 不在这里手写 —— 手写就会与 `sse.js` 那份漂移）。 -->
      <label class="field">链 <select id="chain"></select></label>
      <span class="spacer"></span>
      <span class="hint" id="headhint">逐字回答 · 引用可点开 · 每轮报 token 与费用</span>
    </header>

    <div id="log" class="content log"></div>

    <div id="composer">
      <input id="q" placeholder="问点什么…" autocomplete="off">
      <button id="send" class="btn primary">发送</button>
      <button id="stop" class="btn danger" hidden>停止</button>
    </div>
  </div>
</div>

<script src="/static/js/sse.js"></script>
<script>
'use strict';
/* 页面装配层。⛔ 纯逻辑（帧解析 / 引用映射 / 出口判定 / 费用格式）**不在这里**，
   —— 它们在 /static/js/sse.js 里，且被 node --test 钉住（DEC-085 裁定 #9）。
   ⚠️ 引用正则也**只有 sse.js 那一份**（`RagSse.splitCitations`）——
      本文件里再写一份就会与它漂移，而那**不报错**（表现是"点了没反应"）。 */

const KEY_STORE = 'rag_api_key';
const THREAD_STORE = 'rag_threads';
const CHAIN_STORE = 'rag_chain';   // 上一次选的链（刀 2）

// 状态机：idle → 请求中 → 流式中 → 完成｜已中断｜出错
let state = 'idle';
let controller = null;      // AbortController：停止按钮就靠它
let sawDone, sawError, aborted, firstContentAt, sentAt;

const $ = (id) => document.getElementById(id);

// ---------- 身份 ----------
function currentKey() { return localStorage.getItem(KEY_STORE) || ''; }

function showLogin() {
  $('login').hidden = false;
  $('app').hidden = true;
  $('apikey').value = '';
  $('apikey').focus();
}
function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
}

// 🔴 三种失败说三句话，⛔ 不许合并 —— `DEC-082`/`N9` 的口径：
//    换 key 修不好"认证服务不可用"，而提示他换 key 会让他**查不出原因**。
function explainStatus(status) {
  if (status === 401 || status === 403) return { msg: 'API Key 无效或已过期', relogin: true };
  if (status === 503) return { msg: '认证服务不可用，请稍后重试（⛔ 不是你的 key 的问题）', relogin: false };
  // 🔴 429 走【卡片】而不是一行字（`R3.2` · `DEC-090`）。改前这里是**一句话把两种
  //    熔断并排写在一起**（中间用「/」连起来）—— 而两者恢复条件完全不同：
  //      全站级只能等跨天；会话级**开个新会话立刻能继续**。
  //    写一行必然把两种说成一种 ⇒ **把人引到错误的处置上**（本仓 `N9` 同一条道理）。
  //    ⚠️ 是哪一种，由后端 429 body 里的 `scope` 说了算（`code` 两者相同，分不出来）。
  //    ⛔ **别在注释里把那句原话抄一遍** —— `sse.test.js` 有条结构型守卫按**子串**扫
  //       整个前端（本行上一版就是这么把守卫绊红的，实测）。
  if (status === 429) return { msg: '', relogin: false, breaker: true };
  return { msg: `请求失败（HTTP ${status}）`, relogin: false };
}

// ---------- 会话（真多会话：thread_id 由前端生成，历史由后端按 (user, thread) 存） ----------
function loadThreads() {
  try { return JSON.parse(localStorage.getItem(THREAD_STORE)) || null; }
  catch (e) { console.warn('会话表坏了，已重置', e); return null; }
}
function saveThreads(t) { localStorage.setItem(THREAD_STORE, JSON.stringify(t)); }

// 🔴 返回的一定是【可用】的表：没有就建一个。⛔ 别让调用方自己去判 null ——
//    起草稿里 `renderThreads()` 直接 `loadThreads().threads` ⇒ **第一次打开必抛 TypeError**
//    （`Cannot read properties of null`），页面白屏。实测见施工单 Task 8。
function currentThread() {
  let t = loadThreads();
  if (!t || !t.threads.length) {
    t = { threads: [], current: null };
    newThread(t);
  }
  if (!t.current) t.current = t.threads[0].id;
  return t;
}

function newThread(t) {
  t = t || loadThreads() || { threads: [], current: null };
  // ⚠️ `session_key` 两参必填 ⇒ thread_id **不许为空串**（空串会被后端 fail-closed 拒掉）
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  t.threads.unshift({ id, title: '新会话', createdAt: Date.now() });
  t.current = id;
  saveThreads(t);
  return t;
}

function renderThreads() {
  const t = currentThread();
  const box = $('threads');
  box.innerHTML = '';
  for (const th of t.threads) {
    const d = document.createElement('div');
    d.className = 'thread' + (th.id === t.current ? ' active' : '');
    d.textContent = th.title;
    d.onclick = () => { t.current = th.id; saveThreads(t); renderThreads(); showEmptyLog(); };
    box.appendChild(d);
  }
}

// ⚠️ 本页**不显示历史**（后端没有"取历史"的公开接口，`DEC-085` 契约 C 只把历史喂给模型）。
//    ⇒ 切回旧会话时给一句实话，⛔ 别留一块**看不出所以然的空白**
//    （空白会被读成"这个会话是空的"，而其实模型记得它 —— 见施工单 Task 8 的已知限制）。
function showEmptyLog() {
  $('log').innerHTML = '<p class="hint">（本页不显示历史消息；这个会话的上下文模型仍然记得）</p>';
}

// ---------- 渲染 ----------
function addTurn(question) {
  $('log').insertAdjacentHTML('beforeend',
    `<div class="turn"><div class="q"></div><div class="a"></div><div class="breaker" hidden></div><div class="noinfo" hidden></div><div class="card" hidden></div><div class="meta"></div></div>`);
  const turn = $('log').lastElementChild;
  turn.querySelector('.q').textContent = question;
  // 🔴 本回合当前展开的引用编号（`null` = 都收着）。放**元素上**，⛔ 不放全局 ——
  //    否则两条回答的卡片会互相抢那一个状态（本页可以连问多轮）。
  turn._openIndex = null;
  turn._byIndex = new Map();
  // 🔴 `F4` ①（`DEC-091`）：本回合是不是**无据拒答** —— 由后端那一帧说了算，⛔ 前端不自己判
  //    （判据只该有一份，`sse.test.js` 有结构型守卫盯着）。同样放**元素上**：一页可以连问多轮。
  turn._refused = false;
  return turn;
}

// 把正文里的 [来源:X] 换成可点开的 span。
// 🔴 切分走 `RagSse.splitCitations` —— **正则只有那一份**（⛔ 本文件里不许再有第二份）。
function renderAnswer(el, text, sources) {
  const turn = el.closest('.turn');
  // 🔴 刀 2（§7.1①）：把**当前答案正文**记在 turn 上 —— 引用卡片要高亮
  //    「答案与原文逐字重合的片段」，那就得知道答案是什么。
  //    ⚠️ 记在**这里**（而不是在 `ask()` 的每一处 `renderAnswer` 之前各写一遍）——
  //       那有 5 个调用点，漏一个的表现是"某些轮点开没有高亮"，而**不报错**。
  turn._answer = text;
  // 🔴 `F4` ①（`DEC-091`）：**无据拒答**那一轮走另一条路（见 `renderRefusal`）。
  if (turn._refused) { renderRefusal(turn, el, text); return; }
  const byIndex = new Map(RagSse.resolveCitations(text, sources).map((r) => [r.index, r]));
  turn._byIndex = byIndex;
  el.innerHTML = '';
  for (const seg of RagSse.splitCitations(text)) {
    if (seg.index === undefined) {
      el.appendChild(document.createTextNode(seg.text));
      continue;
    }
    const span = document.createElement('span');
    span.className = 'cite';
    span.dataset.index = String(seg.index);
    span.textContent = '[' + seg.index + ']';
    // ⚠️ 找不到的编号**照样画出来、只是点不动** —— 让"模型吐了个不存在的号"看得见，
    //    ⛔ 别悄悄吞掉（吞掉会让人以为模型没引用）。
    if (byIndex.has(seg.index)) span.onclick = () => toggleCard(turn, seg.index, byIndex.get(seg.index));
    el.appendChild(span);
  }
  syncCard(turn);   // 重画后把"当前开着哪一条"补回去（流式期间本函数会被调很多次）
}

// 🔴 `F4` ①（`DEC-091` · 硬门 B 的**第二半**）：**无据拒答**的呈现 —— 与普通回答**分两条路**。
//
//    ⚠️ 为什么非得分开：拒答那一轮正文里**照样可能带** `[来源:X]` —— 实测（2026-10-06 spike）
//       见过一条拒答**后面挂着 3 个可点来源号**（它列了手上有什么、但答不了）。
//       一边说"答不了"、一边挂 3 个**可点**来源是**自相矛盾**的呈现 ⇒ 这条路上**不切引用**。
//    ⚠️ 本注释**刻意不写那句拒答语**：前端出现它就会绊倒 `sse.test.js` 的结构型守卫
//       （那条守卫数的是"哪些前端文件里出现了它" —— 注释也算，本仓栽过同型事故）。
//    ⚠️ 正文仍**原样显示**：那是模型说的话，⛔ 不替它改写、⛔ 也不吞掉（吞掉等于替模型粉饰）。
//    ⚠️ 文案由 `RagSse.refusalNotice` 给（有 `node --test` 钉着），本函数只管挂 DOM ——
//       ⛔ 别在这里再拼一遍那份文字。
function renderRefusal(turn, el, text) {
  const n = RagSse.refusalNotice();
  const box = turn.querySelector('.noinfo');
  box.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'ni-title';
  h.textContent = n.title;
  const b = document.createElement('div');
  b.className = 'ni-body';
  b.textContent = n.body;
  box.appendChild(h); box.appendChild(b);
  box.hidden = false;

  el.textContent = text;          // ⛔ 走 textContent：不切引用、也不当 HTML（正文可能有尖括号）
  turn._byIndex = new Map();      // 这条路上没有可点的引用 ⇒
  turn._openIndex = null;         // ⇒ 卡片一定是收着的
  syncCard(turn);
}

// 🔴 `DEC-089` · 硬门 B 的「再点能跳到原文位置」= 就地展开/收起（本仓 2026-10-06 裁的「甲」）：
//    卡片挂在该条回答**下面**，点引用展开、再点同一条收起、点另一条换内容。
//    ⛔ 改前那个是「固定挂在 #log 末尾、再点只换内容」的旧版。
//    ⚠️ 旧注释里那个词（`DEC-089` 的 `F8` 判据拿它当"还没修"的标记）**已随本行删掉** ——
//       ⛔ 别再把那个词写回来，否则 `grep` 那条判据会指着一个已经修好的地方说"还没修"。
// ⚠️ 「下一个状态是什么」由 `RagSse.toggleOpen` 说了算（有 `node --test` 钉着）；
//    本函数只管 DOM —— ⛔ 别在这里再写一遍那个三态判断。
function toggleCard(turn, index, src) {
  if (src) turn._byIndex.set(index, src);
  turn._openIndex = RagSse.toggleOpen(turn._openIndex, index);
  syncCard(turn);
  const card = turn.querySelector('.card');
  if (!card.hidden) card.scrollIntoView({ block: 'nearest' });   // 卡片在回答下面 ⇒ 滚进视野
}

// 按 `turn._openIndex` 把卡片画成该有的样子（收起 = `hidden`）。
// 🔴 卡片头走 `RagSse.formatSource` —— ⛔ 本文件里不许再拼一遍那份格式
//    （`sse.test.js` 有结构型用例钉着：那两行只能有一份实现）。
function syncCard(turn) {
  const card = turn.querySelector('.card');
  const idx = turn._openIndex;
  const src = idx === null ? undefined : turn._byIndex.get(idx);

  card.innerHTML = '';
  if (src) {
    const head = RagSse.formatSource(src);
    const h = document.createElement('div');
    h.className = 'src';
    h.textContent = head.title;
    const m = document.createElement('div');
    m.className = 'src-meta';
    m.textContent = head.meta;
    const p = document.createElement('div');
    p.className = 'src-body';
    // 🔴 刀 2（§7.1①）：**把「答案与这段原文逐字重合」的片段高亮出来**。
    //    ⚠️ **它⛔ 不是"服务端给的命中区间"** —— `sources` 帧里没有任何位置字段
    //       （只有 index / source / content / similarity）⇒ 本仓立场是「⛔ 不许印没有数据源的东西」，
    //       所以高亮的是**一句真话**：「这几个字确实是从这段原文里来的」。
    //    ⛔ **找不到重合就不高亮**（`overlapRanges` 回空数组）—— 不假装标了一段。
    //    ⚠️ 阈值 6 个字：再短会把「保修期」这种词标得满屏黄。
    //    🔴 全程 `createElement` / `textContent` 拼节点，⛔ **不用 innerHTML** ——
    //       原文里可能有尖括号，innerHTML 会把它变成标签（本行上一版就是靠 textContent 防的）。
    const body = String(src.content == null ? '' : src.content);
    const ranges = RagSse.overlapRanges(body, turn._answer || '', 6);
    if (!ranges.length) {
      p.textContent = body;
    } else {
      let at = 0;
      for (const r of ranges) {
        if (r.start > at) p.appendChild(document.createTextNode(body.slice(at, r.start)));
        const mk = document.createElement('mark');
        mk.textContent = body.slice(r.start, r.end);
        p.appendChild(mk);
        at = r.end;
      }
      if (at < body.length) p.appendChild(document.createTextNode(body.slice(at)));
    }
    card.appendChild(h); card.appendChild(m); card.appendChild(p);
  }
  card.hidden = !src;
  for (const s of turn.querySelectorAll('.cite')) {
    s.classList.toggle('open', Number(s.dataset.index) === idx);
  }
}

// ---------- 熔断卡片（`R3.2` · `DEC-090`） ----------

/** 读 429 的响应体；读不出就返回 `{}`，⛔ 别为了拿一个字段把整轮拖炸。 */
async function readErrorBody(resp) {
  try { return await resp.json(); }
  catch (e) { console.warn('429 响应体不是 JSON ⇒ 退回通用文案', e); return {}; }
}

// 🔴 四件事的**文字**由 `RagSse.breakerCard` 给（有 `node --test` 钉着），
//    本函数只管挂 DOM —— ⛔ 别在这里再拼一遍那份文案。
// ⚠️ 全部用 `textContent`：`error` 是**后端的自由文本**，`innerHTML` 会把它当标签。
function showBreaker(turn, scope, message) {
  const box = turn.querySelector('.breaker');
  const card = RagSse.breakerCard(scope, message);
  box.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'bk-title';
  h.textContent = card.title;
  box.appendChild(h);
  for (const it of card.items) {
    const row = document.createElement('div');
    row.className = 'bk-row';
    const k = document.createElement('span');
    k.className = 'bk-k';
    k.textContent = it.k;
    const v = document.createElement('span');
    v.className = 'bk-v';
    v.textContent = it.v;
    row.appendChild(k); row.appendChild(v);
    box.appendChild(row);
  }
  box.hidden = false;
  box.scrollIntoView({ block: 'nearest' });
}

// ---------- 发起一次提问 ----------
async function ask() {
  if (state !== 'idle') return;
  const question = $('q').value.trim();
  if (!question) return;

  const t = currentThread();
  const threadId = t.current;
  const thread = t.threads.find((x) => x.id === threadId);
  if (thread && thread.title === '新会话') {
    thread.title = question.slice(0, 20);
    saveThreads(t); renderThreads();
  }

  const turn = addTurn(question);
  const aEl = turn.querySelector('.a');
  const metaEl = turn.querySelector('.meta');

  state = '请求中';
  sawDone = false; sawError = false; aborted = false; firstContentAt = null;
  let answer = '', sources = [], usage = null, exit = 'incomplete';
  controller = new AbortController();
  $('send').disabled = true; $('stop').hidden = false;
  sentAt = performance.now();

  // 🔴 6 条链的请求形状【不是同一套】（`rag_stream` 走 JSON body · 5 条 agent 走 query 参数 ·
  //    `plan_execute` 那个键叫 `goal`）⇒ **统一交给 `RagSse.buildRequest` 一处生成**。
  //    ⛔ 别在这页里再手拼一次 URL —— 两处一定漂移，而**表现是"没反应"，不报错**。
  //    📄 形状表与依据 ⇒ `app/static/js/sse.js` 的 `CHAINS` 那段注释。
  const chain = $('chain').value || 'rag_stream';
  try {
    const { url, init } = RagSse.buildRequest(chain, question, threadId, currentKey());
    const resp = await fetch(url, Object.assign({}, init, { signal: controller.signal }));

    if (!resp.ok) {
      const { msg, relogin, breaker } = explainStatus(resp.status);
      if (breaker) {
        // 🔴 `R3.2`：429 画卡片，⛔ 不退化成一行字 / 白屏 / 通用错误页（`R3.3`）。
        //    哪一种熔断由 body 里的 `scope` 说 —— 读不出就传 `undefined`，
        //    卡片会把「何时恢复」画成 `—`，⛔ 不猜（猜错会把人引到做不到的处置上）。
        const body = await readErrorBody(resp);
        showBreaker(turn, body.scope, body.error);
      } else {
        aEl.textContent = msg;
      }
      if (relogin) localStorage.removeItem(KEY_STORE);
      // 🔴 2026-10-06 施工实测·订正⑧：起草稿这里**只写了 `metaEl.textContent = '出错'`，
      //    没有置 `exit`** ⇒ `exit` 还是 'incomplete' ⇒ 下面 `finally` 会把这行**覆盖成
      //    「本轮未计费 · 未收到结束标志」** ⇒ 用户看到的**不是"出错"**。
      //    改法：把出口置成 'error'，让 `finally` 那段**唯一的**收尾逻辑去写这一行。
      exit = 'error';
      if (relogin) { showLogin(); return; }
      return;
    }

    state = '流式中';
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    // 🔴 **直到连接关闭才收工** —— 见 [DONE] 就 return 会把 `sources` 与 `usage` 整段丢掉
    //    （[DONE] 排在它们**之前**是线上契约，`api_v1_rag.py` 的 `_complete` 明写）。
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const { payloads, rest } = RagSse.parseSseChunk(buffer);
      buffer = rest;
      for (const p of payloads) {
        const kind = RagSse.payloadKind(p);
        if (kind === 'content') {
          if (firstContentAt === null) firstContentAt = performance.now();
          answer += p.content;
          renderAnswer(aEl, answer, sources);       // 有了 sources 才能把引用变成可点的
        } else if (kind === 'sources') {
          sources = p.sources;
          renderAnswer(aEl, answer, sources);
        } else if (kind === 'usage') {
          usage = p.usage;
        } else if (kind === 'no_answer') {
          // 🔴 `F4` ①（`DEC-091`）：后端判定这一轮是**无据拒答** ⇒ 换渲染路径。
          //    ⚠️ 重置一次引用状态：正文里可能带着 `[来源:X]`，那条路上**不切引用**、
          //       卡片也必须是收着的（`renderRefusal` 负责），这里只置标志 + 重画。
          turn._refused = true;
          renderAnswer(aEl, answer, sources);
        } else if (kind === 'error') {
          sawError = true;
          answer += `\n[出错] ${p.error}`;
          renderAnswer(aEl, answer, sources);
        } else if (kind === 'done') {
          sawDone = true;
        }
      }
    }
    exit = RagSse.classifyExit({ sawDone, sawError, aborted });
  } catch (err) {
    if (err.name === 'AbortError') {
      aborted = true;
      exit = 'aborted';
    } else {
      sawError = true;
      exit = 'error';
      aEl.textContent = answer + `\n[网络出错] ${err.message}`;
    }
  } finally {
    state = 'idle';
    controller = null;
    $('send').disabled = false; $('stop').hidden = true;

    // 收场徽标 + 费用行
    if (exit === 'aborted') {
      turn.querySelector('.a').insertAdjacentHTML('beforeend', '<span class="badge">已中断</span>');
    }
    const parts = [];
    if (exit === 'aborted') {
      // 🔴 刀 2（§7.1②）：**说清"停在哪"**。
      //    ⚠️ 不是文案选择，是在说事实：`usage` 只在**最后一帧**回来，
      //       而我们提前关流 ⇒ **那帧到不了**（`DEC-084`）⇒ **没有 token 数可印**。
      //    ⇒ 给数得出来的那个（已生成多少字）+ 明写未计费与原因。
      //    📄 逻辑在 `sse.js::stoppedNotice`（有用例钉着，⛔ 别在这页里再拼一次）。
      parts.push(RagSse.stoppedNotice(answer));
    } else if (usage) {
      parts.push(`${usage.model}`);
      parts.push(`${usage.prompt_tokens}+${usage.completion_tokens} tok`);
      parts.push(RagSse.formatCost(usage.cost_usd));
    } else {
      parts.push('本轮未计费');
    }
    // 首字延迟**前端自己测**（⛔ 不伪装成服务端指标 —— 本仓有"性能数字要先说清是目标还是实测"的前科）
    if (firstContentAt !== null) parts.push(`首字 ${Math.round(firstContentAt - sentAt)} ms`);
    parts.push({ done: '完成', aborted: '已中断', error: '出错', incomplete: '未收到结束标志' }[exit]);
    metaEl.textContent = parts.join(' · ');
    $('q').value = '';
    $('log').scrollTop = $('log').scrollHeight;
  }
}

// ---------- 停止 ----------
$('stop').onclick = () => {
  if (controller) controller.abort();   // 硬门 C：Network 里那条请求必须真的变成 (canceled)
};

// ---------- 装配 ----------
$('save').onclick = () => {
  const k = $('apikey').value.trim();
  if (!k) return;
  localStorage.setItem(KEY_STORE, k);
  showApp(); renderThreads();
};
$('send').onclick = ask;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
$('newthread').onclick = () => { newThread(); renderThreads(); showEmptyLog(); };

// ---------- 链选择器（刀 2）----------
// ⚠️ 选项**从 `RagSse.CHAINS` 生成** —— ⛔ 别在这页里手写一份（两份必然漂移，
//    而漂移的表现是"某条链选了没反应"，不报错）。
(function fillChains() {
  const sel = $('chain');
  for (const k of RagSse.CHAIN_KEYS) {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = RagSse.CHAINS[k].label;
    sel.appendChild(opt);
  }
  // 存过的链名**必须先在 CHAINS 里核一遍** —— 旧版本存下的名字（或手改过 localStorage）
  // 会让 `sel.value = 'xxx'` 静默变成空串 ⇒ 发送时回落 `rag_stream`，而页面上看不出选的是哪条。
  const saved = localStorage.getItem(CHAIN_STORE);
  sel.value = RagSse.CHAINS[saved] ? saved : 'rag_stream';
  sel.onchange = () => localStorage.setItem(CHAIN_STORE, sel.value);
})();

(currentKey() ? (showApp(), renderThreads()) : showLogin());
</script>
</body>
</html>
